packages:
  - "apps/*"
  - "packages/*"
  - "tools/www-assets"

autoInstallPeers: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "mediabunny@1.56.0"
  - "@mediabunny/aac-encoder@1.56.0"
  - "@mediabunny/ac3@1.56.0"
  - "@techsquidtv/canvas-timeline@0.4.0"
  - "@techsquidtv/canvas-timeline-core@0.4.0"
  - "@techsquidtv/canvas-timeline-html-media-adapter@0.4.0"
  - "@techsquidtv/canvas-timeline-mediabunny-adapter@0.4.0"
  - "@techsquidtv/canvas-timeline-react@0.4.0"
  - "@techsquidtv/canvas-timeline-renderer@0.4.0"
  - "@techsquidtv/canvas-timeline-utils@0.4.0"
  - "@techsquidtv/gifenc@1.1.0"

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  baseline-browser-mapping: 2.10.31
  enhanced-resolve: 5.21.3
  es-object-atoms: 1.1.1

peerDependencyRules:
  ignoreMissing:
    - mssql
    - "@types/mssql"
