packages:
  - "apps/*"
  - "packages/*"
  - "tools/www-assets"

autoInstallPeers: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@techsquidtv/canvas-timeline@0.5.0"
  - "@techsquidtv/canvas-timeline-core@0.5.0"
  - "@techsquidtv/canvas-timeline-html-media-adapter@0.5.0"
  - "@techsquidtv/canvas-timeline-mediabunny-adapter@0.5.0"
  - "@techsquidtv/canvas-timeline-react@0.5.0"
  - "@techsquidtv/canvas-timeline-renderer@0.5.0"
  - "@techsquidtv/canvas-timeline-utils@0.5.0"
  - "@techsquidtv/gifenc@1.1.0"

allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  workerd: true

overrides:
  # Astro augments HAST types; converters must share that same type instance.
  "@types/hast": 3.0.5
  # The OpenAPI parser pins vulnerable js-yaml; remove when it requires >=4.3.2.
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  enhanced-resolve: 5.26.0
  es-object-atoms: 1.1.2

peerDependencyRules:
  ignoreMissing:
    - mssql
    - "@types/mssql"
