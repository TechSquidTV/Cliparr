name: cliparr-dev

x-development-image: &development-image
  image: cliparr-dev:local
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: development
    args:
      DEV_UID: ${CLIPARR_DEV_UID:-1000}
      DEV_GID: ${CLIPARR_DEV_GID:-1000}

services:
  media-seed:
    <<: *development-image
    profiles: [plex, jellyfin]
    command: ["sh", "/opt/cliparr/docker/seed-media.sh"]
    environment:
      MEDIA_ROOT: /media
      CI: ${CI:-false}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-false}
      SINTEL_URL: ${SINTEL_URL:-}
      SINTEL_SHA256: ${SINTEL_SHA256:-}
    volumes:
      - cliparr-dev-media:/media
    networks:
      - cliparr-dev

  jellyfin:
    profiles: [jellyfin]
    image: jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
    hostname: jellyfin
    depends_on:
      media-seed:
        condition: service_completed_successfully
    environment:
      JELLYFIN_PublishedServerUrl: http://localhost:8096
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - cliparr-dev-media:/media:ro
    networks:
      - cliparr-dev
    restart: unless-stopped

  jellyfin-bootstrap:
    <<: *development-image
    depends_on:
      media-seed:
        condition: service_completed_successfully
      jellyfin:
        condition: service_healthy
    profiles: [jellyfin]
    command: ["sh", "/opt/cliparr/docker/bootstrap-jellyfin.sh"]
    environment:
      JELLYFIN_BASE_URL: http://jellyfin:8096
      JELLYFIN_ADMIN_USERNAME: cliparr
      JELLYFIN_ADMIN_PASSWORD: cliparr-dev
      JELLYFIN_LIBRARY_NAME: Movies
      JELLYFIN_LIBRARY_PATH: /media/movies
    networks:
      - cliparr-dev

  plex:
    profiles: [plex]
    image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
    depends_on:
      media-seed:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/New_York}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      ADVERTISE_IP: http://localhost:32400/,http://plex:32400/
      # Bootstrap shares Plex's network namespace; trust only loopback.
      ALLOWED_NETWORKS: 127.0.0.1/32
    ports:
      - "127.0.0.1:32400:32400"
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - cliparr-dev-media:/data:ro
    networks:
      - cliparr-dev
    restart: unless-stopped

  plex-bootstrap:
    <<: *development-image
    profiles: [plex]
    depends_on:
      media-seed:
        condition: service_completed_successfully
      plex:
        condition: service_started
    network_mode: service:plex
    command: ["node", "/plex/src/bootstrap.ts"]
    environment:
      PLEX_BASE_URL: http://127.0.0.1:32400
      PLEX_LIBRARY_NAME: Movies
      PLEX_LIBRARY_PATH: /data/movies
      PLEX_LIBRARY_LANGUAGE: en-US
    volumes:
      - ../packages/plex:/plex:ro

  cliparr:
    <<: *development-image
    working_dir: /workspace
    command:
      - /bin/sh
      - -lc
      - pnpm install --frozen-lockfile --config.confirmModulesPurge=false && pnpm run dev:docker
    environment:
      APP_KEY: cliparr-dev-only-not-secure-key-1234
      PORT: "3000"
      CLIPARR_DATA_DIR: /data
      CLIPARR_FRONTEND_URL: http://localhost:5173
      CHOKIDAR_USEPOLLING: "true"
      VITE_CLIPARR_DEV_JELLYFIN_URL: http://jellyfin:8096
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5173:5173"
    volumes:
      - ..:/workspace
      - cliparr-dev-data:/data
      - cliparr-dev-root-node-modules:/workspace/node_modules
      - cliparr-dev-server-node-modules:/workspace/apps/server/node_modules
      - cliparr-dev-frontend-node-modules:/workspace/apps/frontend/node_modules
      - cliparr-dev-www-node-modules:/workspace/apps/www/node_modules
      - cliparr-dev-shared-node-modules:/workspace/packages/shared/node_modules
      - cliparr-dev-plex-node-modules:/workspace/packages/plex/node_modules
      - cliparr-dev-assets-node-modules:/workspace/tools/www-assets/node_modules
      - cliparr-dev-pnpm-store:/pnpm/store
    networks:
      - cliparr-dev

networks:
  cliparr-dev:

volumes:
  cliparr-dev-media:
  jellyfin-config:
  jellyfin-cache:
  plex-config:
  plex-transcode:
  cliparr-dev-data:
  cliparr-dev-root-node-modules:
  cliparr-dev-server-node-modules:
  cliparr-dev-frontend-node-modules:
  cliparr-dev-www-node-modules:
  cliparr-dev-shared-node-modules:
  cliparr-dev-plex-node-modules:
  cliparr-dev-assets-node-modules:
  cliparr-dev-pnpm-store:
