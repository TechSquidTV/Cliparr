name: Update Plex contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-plex-pms-sdk
  cancel-in-progress: false

jobs:
  update:
    name: Update Plex contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Plex contracts
        id: update
        run: |
          mkdir -p "$RUNNER_TEMP/plex-update"
          set -o pipefail
          pnpm plex:sdk:update --report-dir "$RUNNER_TEMP/plex-update" 2>&1 | tee "$RUNNER_TEMP/plex-update/update.log"

      - name: Detect changed contracts
        id: contracts
        run: |
          if git diff --quiet -- packages/plex; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate consumers and repository
        id: preflight
        if: steps.contracts.outputs.changed == 'true'
        run: |
          set -o pipefail
          pnpm preflight 2>&1 | tee "$RUNNER_TEMP/plex-update/preflight.log"

      - name: Report blocked update
        if: failure() && (steps.update.outcome == 'failure' || steps.preflight.outcome == 'failure')
        run: |
          report="$RUNNER_TEMP/plex-update/report.md"
          if [ ! -f "$report" ]; then
            mkdir -p "$RUNNER_TEMP/plex-update/candidate"
            cp -R packages/plex/openapi "$RUNNER_TEMP/plex-update/candidate/openapi"
            cp -R packages/plex/src/generated "$RUNNER_TEMP/plex-update/candidate/generated"
            cat > "$report" <<'REPORT'
          # Plex contract update blocked

          The contract updater or repository validation failed. No update was published.
          The candidate contracts and validation logs are attached for review.
          REPORT
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blocked update evidence
        if: failure() && (steps.update.outcome == 'failure' || steps.preflight.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: plex-update-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plex-update
          retention-days: 14
          if-no-files-found: error

      - name: Open pull request
        if: steps.contracts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: chore/cliparr/update-plex-contracts
          PR_BODY: |
            Updates the official PMS snapshot from https://developer.plex.tv/pms/ and regenerates @cliparr/plex using the reviewed PMS supplement and local cloud contract.

            Generation is reproducible; consumer type checks, contract tests, server tests, and repository preflight passed.
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- packages/plex/openapi packages/plex/src/generated)" ]]; then
            echo "Plex PMS SDK is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          body_file="$(mktemp)"
          printf '%s\n' "${PR_BODY}" > "${body_file}"
          git switch --create "${BRANCH_NAME}"
          git add packages/plex/openapi packages/plex/src/generated
          git commit -m "chore(cliparr): update generated Plex contracts"
          git push --force-with-lease origin "${BRANCH_NAME}"

          if gh pr view "${BRANCH_NAME}" --json number >/dev/null 2>&1; then
            gh pr edit "${BRANCH_NAME}" \
              --title "chore(cliparr): update generated Plex contracts" \
              --body-file "${body_file}"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "chore(cliparr): update generated Plex contracts" \
            --body-file "${body_file}"
