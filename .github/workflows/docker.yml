name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/techsquidtv/cliparr
  IMAGE_DESCRIPTION: Instant media clipper for Plex and Jellyfin servers.

jobs:
  changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Only PRs need change detection; pushes and manual dispatches always
      # build (pushes refresh the shared cache and verify arm64).
      - name: Check changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'apps/server/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'config/**'
              - 'tools/ci/smoke-image.sh'
              - 'tools/ci/summary.mjs'
              - '.github/workflows/docker.yml'

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: changes
    # Keep the required check reporting; run validation if detection fails.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Only needed for the arm64 leg, which runs on main pushes and manual
      # dispatches, not on PRs.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-beta.') }}
            type=raw,value=rc,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-rc.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Resolve app version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            version="${ref_name}@${GITHUB_SHA::7}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/prod.Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          build-args: |
            CLIPARR_VERSION=${{ steps.version.outputs.value }}
          tags: cliparr:smoke
          cache-from: type=gha

      - name: Smoke test image
        id: smoke
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: bash tools/ci/smoke-image.sh cliparr:smoke "$EXPECTED_VERSION"

      # Full multi-arch verification plus shared-cache refresh. Runs on main
      # pushes and manual dispatches only; PRs get the amd64 smoke build
      # above, which is enough to validate the Dockerfile.
      - name: Build Docker image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/prod.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          build-args: |
            CLIPARR_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write CI summary
        if: always()
        env:
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: "true"
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLIPARR_VERSION: ${{ steps.version.outputs.value }}
        run: node tools/ci/summary.mjs
