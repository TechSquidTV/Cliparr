name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/techsquidtv/cliparr
  IMAGE_DESCRIPTION: Instant media clipper for Plex and Jellyfin servers.

jobs:
  changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Only PRs need change detection; pushes and manual dispatches always
      # build (pushes refresh the shared cache and verify arm64).
      - name: Check changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            docker:
              - 'docker/**'
              - '.dockerignore'
              - '.github/actions/scan-image/**'
              - 'apps/server/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'config/**'
              - 'tools/ci/smoke-image.sh'
              - 'tools/www-assets/**'
              - 'tools/ci/summary.mjs'
              - '.github/workflows/docker.yml'

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: changes
    # Keep the required check reporting; run validation if detection fails.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Compilation stays native; QEMU runs the arm64 runtime smoke test.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate Compose definitions
        env:
          APP_KEY: compose-validation-key-with-at-least-32-characters
          CAPTURE_MEDIA_DIR: /tmp
          CAPTURE_OUTPUT_DIR: /tmp
          CAPTURE_PASSWORD: compose-validation-password
          CAPTURE_APP_KEY: compose-validation-key-with-at-least-32-characters
        run: |
          docker compose -f docker/compose.yml config --quiet
          for profile in plex jellyfin '*'; do
            docker compose -f docker/compose.dev.yml --profile "$profile" config --quiet
          done
          docker compose -f docker/compose.dev.yml config --quiet
          docker compose -f docker/compose.capture.yml config --quiet
          bash -n tools/ci/smoke-image.sh
          for script in docker/*.sh; do sh -n "$script"; done

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-beta.') }}
            type=raw,value=rc,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-rc.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Resolve app version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            version="${ref_name}@${GITHUB_SHA::7}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64
          pull: true
          load: true
          build-args: |
            CLIPARR_VERSION=${{ steps.version.outputs.value }}
          tags: cliparr:smoke
          cache-from: type=gha,scope=cliparr-production

      - name: Scan image and dependency inventory
        uses: ./.github/actions/scan-image
        with:
          image: cliparr:smoke

      - name: Smoke test image
        id: smoke
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: bash tools/ci/smoke-image.sh cliparr:smoke "$EXPECTED_VERSION"

      - name: Build arm64 smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/arm64
          pull: true
          load: true
          build-args: |
            CLIPARR_VERSION=${{ steps.version.outputs.value }}
          tags: cliparr:smoke-arm64
          cache-from: type=gha,scope=cliparr-production

      - name: Smoke test arm64 image
        id: smoke_arm64
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: bash tools/ci/smoke-image.sh cliparr:smoke-arm64 "$EXPECTED_VERSION" linux/arm64

      # Both architectures are built and smoke-tested above, including on PRs.
      # Refresh the multi-platform shared cache on main pushes and manual runs.
      - name: Build Docker image
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          build-args: |
            CLIPARR_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cliparr-production
          cache-to: type=gha,mode=max,scope=cliparr-production

      - name: Write CI summary
        if: always()
        env:
          # Build outputs include large provenance metadata; keep the summary input bounded.
          SUMMARY_STEPS: >-
            {
              "smoke": {
                "outcome": "${{ steps.smoke.outcome }}",
                "outputs": { "runtime_node": "${{ steps.smoke.outputs.runtime_node }}" }
              },
              "smoke_arm64": {
                "outcome": "${{ steps.smoke_arm64.outcome }}",
                "outputs": { "runtime_node": "${{ steps.smoke_arm64.outputs.runtime_node }}" }
              },
              "publish": { "outcome": "${{ steps.publish.outcome }}" }
            }
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: "true"
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLIPARR_VERSION: ${{ steps.version.outputs.value }}
        run: node tools/ci/summary.mjs

  auxiliary:
    name: Validate ${{ matrix.target }} image
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docker == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        target: [development, capture]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build auxiliary image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: cliparr-${{ matrix.target }}:check
          cache-from: |
            type=gha,scope=cliparr-${{ matrix.target }}
            type=gha,scope=cliparr-production
          cache-to: type=gha,mode=max,scope=cliparr-${{ matrix.target }}
      - name: Scan auxiliary image and dependency inventory
        uses: ./.github/actions/scan-image
        with:
          image: cliparr-${{ matrix.target }}:check
          artifact-name: ${{ matrix.target }}-dependency-inventory
      - name: Verify non-root tools
        env:
          IMAGE: cliparr-${{ matrix.target }}:check
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c 'test "$(id -u)" != 0 && command -v node && command -v curl && command -v jq'
          if [[ "$TARGET" == capture ]]; then
            browser_smoke='import { chromium } from "playwright"; const browser = await chromium.launch(); const page = await browser.newPage(); await page.setContent("<title>capture smoke</title>"); if (await page.title() !== "capture smoke") throw new Error("Browser smoke failed"); await browser.close();'
            docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,size=1g --shm-size=1g --entrypoint node "$IMAGE" \
              --input-type=module -e "$browser_smoke"
            docker run --rm --entrypoint ffmpeg "$IMAGE" -version
          fi
