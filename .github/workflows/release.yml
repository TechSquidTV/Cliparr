name: Release

on:
  workflow_dispatch:
    inputs:
      rc:
        description: Create as Release Candidate (pre-release)
        required: true
        default: false
        type: boolean
      dry_run:
        description: Plan, check, and generate notes without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/techsquidtv/cliparr
  IMAGE_DESCRIPTION: Instant media clipper for Plex and Jellyfin servers.

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    outputs:
      release_url: ${{ steps.github-release.outputs.html_url }}
    env:
      RELEASE_PLAN_FILE: /tmp/cliparr-release-plan/plan.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Require main branch
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must run from main. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Restore release plan on retry
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$RELEASE_PLAN_FILE")"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name == "release-plan") | .id')"
          if [[ -n "$artifact_id" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-plan --dir "$(dirname "$RELEASE_PLAN_FILE")"
            echo 'restored=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Plan release
        id: plan
        run: |
          CHANNEL="stable"
          if [[ "${{ inputs.rc }}" == "true" ]]; then
            CHANNEL="rc"
          fi

          node tools/release/plan-release.mjs \
            --channel "${CHANNEL}" \
            --target "${GITHUB_SHA}" \
            --image-name "${IMAGE_NAME}" \
            --github-output

      - name: Preserve release plan for retries
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: ${{ env.RELEASE_PLAN_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Summarize release plan
        env:
          SUMMARY_PHASE: plan
          DRY_RUN: ${{ inputs.dry_run }}
        run: node tools/ci/summary.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        id: format
        run: pnpm format:check

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Knip
        id: knip
        run: pnpm knip

      - name: Test
        id: test
        run: pnpm test

      - name: Docs check
        id: docs
        run: pnpm docs:check

      - name: Build
        id: build
        env:
          CLIPARR_VERSION: ${{ steps.plan.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/prod.Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          build-args: |
            CLIPARR_VERSION=${{ steps.plan.outputs.tag }}
          tags: cliparr:smoke
          cache-from: type=gha

      - name: Smoke test image
        id: smoke
        env:
          EXPECTED_VERSION: ${{ steps.plan.outputs.tag }}
        run: bash tools/ci/smoke-image.sh cliparr:smoke "$EXPECTED_VERSION"

      - name: Validate release secrets
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_PAGES_DEPLOY_HOOK_URL}" ]]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK_URL is required for publishing releases." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/prod.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ !inputs.dry_run }}
          build-args: |
            CLIPARR_VERSION=${{ steps.plan.outputs.tag }}
          tags: ${{ env.IMAGE_NAME }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Cliparr
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published amd64 digest
        id: verify_amd64
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.tag }}
        run: bash tools/ci/smoke-image.sh "$IMAGE_NAME@$IMAGE_DIGEST" "$EXPECTED_VERSION" linux/amd64

      - name: Verify published arm64 digest
        id: verify_arm64
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.plan.outputs.tag }}
        run: bash tools/ci/smoke-image.sh "$IMAGE_NAME@$IMAGE_DIGEST" "$EXPECTED_VERSION" linux/arm64

      - name: Write Docker tags file
        run: |
          printf '%s\n' "${{ steps.plan.outputs.docker_tags }}" > "${RUNNER_TEMP}/docker-tags.txt"

      - name: Create GitHub release
        id: github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --tag "${{ steps.plan.outputs.tag }}"
            --target "${GITHUB_SHA}"
            --previous-tag "${{ steps.plan.outputs.previous_tag }}"
            --name "${{ steps.plan.outputs.release_name }}"
            --image-name "${IMAGE_NAME}"
            --image-digest "${{ steps.publish.outputs.digest }}"
            --docker-tags-file "${RUNNER_TEMP}/docker-tags.txt"
          )

          notes_file="tools/release/notes/${{ steps.plan.outputs.tag }}.md"
          if [[ -f "${notes_file}" ]]; then
            args+=(--notes-file "${notes_file}")
          fi

          if [[ "${{ steps.plan.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          node tools/release/create-github-release.mjs "${args[@]}"

      - name: Promote tested Docker image
        id: aliases
        if: ${{ !inputs.dry_run }}
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          DOCKER_TAGS: ${{ steps.plan.outputs.docker_tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$DOCKER_TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE_NAME@$IMAGE_DIGEST"

      - name: Write release summary
        if: always()
        env:
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_URL: ${{ steps.github-release.outputs.html_url }}
        run: node tools/ci/summary.mjs

  changelog:
    name: Refresh changelog
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK_URL"

      - name: Summarize changelog refresh
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
        run: |
          printf '## Changelog refresh\n\nResult: %s\n\n[Published release](%s)\n\nIf the refresh failed, rerun this job; the release is already published.\n' "$RESULT" "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
