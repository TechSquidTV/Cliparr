name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve app version
        run: |
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "CLIPARR_VERSION=${ref_name}@${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        id: format
        run: pnpm format:check

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Knip
        id: knip
        run: pnpm knip

      - name: Test
        id: test
        run: pnpm test

      - name: Docs check
        id: docs
        run: pnpm docs:check

      - name: Build
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Write CI summary
        if: always()
        env:
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/summary.mjs
